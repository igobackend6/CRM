# Sales CRM API on a single VPS: the FastAPI backend behind Caddy, which gets and renews the
# HTTPS certificate by itself. Steps: docs/setup/deploy-vps.md
#
#   cp .env.example .env     # then fill it in (DOMAIN + the backend settings)
#   docker compose up -d --build
services:
  api:
    build: ../backend
    env_file: .env
    environment:
      ENVIRONMENT: production
    restart: unless-stopped
    # Not published to the internet: only Caddy (same private network) can reach it.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
