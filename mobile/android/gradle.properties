org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Works around a Kotlin Build-Tools-API incremental-cache race on Windows
# ("already registered"/"Could not close incremental caches") seen when
# building url_launcher_android/shared_preferences_android with this
# Kotlin/AGP version combination — disables Kotlin incremental
# compilation (slower rebuilds, but avoids the crash).
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
